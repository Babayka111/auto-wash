services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: autowash
      POSTGRES_PASSWORD: autowash
      POSTGRES_DB: autowash
    ports:
      - "5432:5432"
    volumes:
      - autowash_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autowash -d autowash"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  autowash_pgdata:
